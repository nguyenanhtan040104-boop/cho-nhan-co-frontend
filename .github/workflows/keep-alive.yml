name: keep-alive

# The free Render server sleeps after 15 minutes without traffic, so the first visitor waits up to a minute.
# This pings the API every 10 minutes to keep it awake. The request also touches the database, which keeps
# the free Supabase project from pausing. Delete this file to turn it off.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: curl -fsS -m 90 "https://cho-nhan-co-backend.onrender.com/api/products?limit=1" > /dev/null || echo "API did not answer"